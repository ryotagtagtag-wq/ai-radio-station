name: AI Radio Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 依存パッケージインストール
        run: npm ci

      - name: Vite ビルド (ベースパス ./)
        run: |
          VITE_BASE="./" VITE_GITHUB_REPO="${{ github.repository }}" npm run build

      - name: output/ を dist/ にコピー (catalog.json, feeds, audio)
        run: |
          cp -r output/* dist/

      - name: アップロード artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
