name: AI Radio Generate & Deploy

on:
  schedule:
    # モーニング番組: 毎日 07:00 UTC
    - cron: "0 7 * * *"
    # イブニング番組: 毎日 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      show_ids:
        description: "生成対象の番組ID（カンマ区切り、例: morning-show,evening-show）"
        required: false
        default: "morning-show"
      base_path:
        description: "フロントエンド連携用ベースパス (./ または /<repo>/)"
        required: false
        default: "./"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python 依存パッケージインストール
        run: |
          pip install -r backend/requirements.txt

      - name: ffmpeg インストール (音声処理用)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Node.js 依存パッケージインストール
        run: npm ci

      - name: 生成対象番組一覧を決定
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "show_ids=morning-show,evening-show" >> $GITHUB_OUTPUT
          else
            echo "show_ids=${{ github.event.inputs.show_ids }}" >> $GITHUB_OUTPUT
          fi

      - name: 生成パイプライン実行（各番組）
        run: |
          IFS=',' read -ra IDS <<< "${{ steps.matrix.outputs.show_ids }}"
          for show_id in "${IDS[@]}"; do
            show_id=$(echo "$show_id" | xargs)
            echo "=== 生成開始: $show_id ==="
            python backend/main.py \
              --show-id "$show_id" \
              --base-path "${{ github.event.inputs.base_path || './' }}"
            echo "=== 生成完了: $show_id ==="
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nextcloud Talk 通知（設定済み時のみ有効）
          NEXTCLOUD_URL: ${{ secrets.NEXTCLOUD_URL }}
          NEXTCLOUD_TALK_TOKEN: ${{ secrets.NEXTCLOUD_TALK_TOKEN }}
          NEXTCLOUD_TALK_ROOM_ID: ${{ secrets.NEXTCLOUD_TALK_ROOM_ID }}
          NEXTCLOUD_BOT_SECRET: ${{ secrets.NEXTCLOUD_BOT_SECRET }}
          NEXTCLOUD_TALK_WEBHOOK_URL: ${{ secrets.NEXTCLOUD_TALK_WEBHOOK_URL }}
          # PWA ページのベースURL（GitHub Pages）
          PWA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.repository }}

      - name: 生成物をコミット・プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data/
          git commit -m "chore: generate radio episodes for ${{ steps.matrix.outputs.show_ids }}" || true
          git push

      - name: Vite ビルド (ベースパス ./)
        run: |
          VITE_BASE="./" VITE_GITHUB_REPO="${{ github.repository }}" npm run build

      - name: output/ を dist/ にコピー (catalog.json, feeds, audio)
        run: |
          cp -r output/* dist/

      - name: アップロード artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: GitHub Pages デプロイ
        uses: actions/deploy-pages@v4
